[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqt5-ela-pro"
dynamic = ["version"]
description = "PyQt5 extension widgets based on PyQt5ElaWidgetTools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "pyqt5-ela-pro contributors"}
]
keywords = ["pyqt5", "widgets", "gui", "extension"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: GUI Development",
]
dependencies = [
    "PyQt5>=5.15.0",
    "pypinyin>=0.50.0",
    "pyqt5-elawidgettools==0.13.0",
]

[project.optional-dependencies]
all = [
    "pywin32>=306",
    "comtypes>=1.4.0",
    "pygments>=2.15",
    "tsdownsample>=0.1.5.1",
    "mermaidx>=0.9",
    "orjson>=3.9",
    "polars>=1.0",
]
# ElaParquetTable 从顶层 __init__ 导出，所以「装了包却拿到一个必然抛
# ImportError 的公开类」是可达的。charts 系列的 polars / numpy /
# tsdownsample 走的就是 optional-dependencies 这条路，这里补齐同一套约定。
parquet = [
    "polars>=1.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/mengdeer589/pyqt5-ela-pro"
Documentation = "https://github.com/mengdeer589/pyqt5-ela-pro#readme"
Repository = "https://github.com/mengdeer589/pyqt5-ela-pro"
Issues = "https://github.com/mengdeer589/pyqt5-ela-pro/issues"

[tool.setuptools.dynamic]
version = {attr = "pyqt5_ela_pro._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["PyQt*", "PyQt-Fluent*", "PyQt-SiliconUI*", "build*", "dist*", "*.egg-info"]
include = ["pyqt5_ela_pro*"]

[tool.setuptools.package-data]
# 不再随包分发任何图标集（曾内置 3.66 MB / 2604 个 Fluent UI 图标 —— 组件库
# 不该替宿主选一套设计语言，绝大多数宿主也根本不用）。宿主用自己的图标包时
# 走 ElaSvgIconLoader.setPackageDirectory() / loadFromFile()，路径在宿主那边。
pyqt5_ela_pro = []

[tool.uv]
required-environments="sys_platform == 'win32' and platform_machine == 'AMD64'"

# 开发期用本地编译的轮子（`uv run` / `uv sync` 都会按它锁定环境）。
# **不影响 `uv build --wheel` 的发布元数据**：tool.uv.sources 只被 uv 用于
# 本项目的依赖解析，发布时读的仍是 [project].dependencies 里的版本约束。
# 本地轮子重编译后哈希会变，`uv run` / `uv sync` 报 `Hash mismatch`。
# **uv 0.12.x 实测：`--refresh-package` / `--no-cache` 都不重算 path wheel 的
# artifact 哈希**；让该依赖重新解析（临时改本行约束跑一次 `uv lock` 再改回来）
# 或把 `uv.lock` 里 wheels.hash 换成文件 sha256 后 `uv sync`：
#   python -c "import hashlib,pathlib;print(hashlib.sha256(pathlib.Path(r'PyElaWidgetTools/dist/pyqt5_elawidgettools-0.13.0-cp37-abi3-win_amd64.whl').read_bytes()).hexdigest())"
# 版本号升级时记得同步改 dependencies 的 `==0.13.0` 与本路径。
[tool.uv.sources]
pyqt5-elawidgettools = { path = "PyElaWidgetTools/dist/pyqt5_elawidgettools-0.13.0-cp37-abi3-win_amd64.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让测试目录本身可导入，`from _qthelpers import wait_until` 才能在各子目录的
# 测试文件里生效（tests/ 下没有 __init__.py，否则靠 conftest 的副作用隐式生效）。
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.14.1",
    "pygments>=2.15",
    "tsdownsample>=0.1.5.1",
    "orjson>=3.9",
]
