[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqt5-ela-pro"
dynamic = ["version"]
description = "PyQt5 extension widgets based on PyQt5ElaWidgetTools"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "pyqt5-ela-pro contributors"}
]
keywords = ["pyqt5", "widgets", "gui", "extension"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: GUI Development",
]
dependencies = [
    "PyQt5>=5.15.0",
    "pypinyin>=0.50.0",
    "pyqt5-elawidgettools==0.12.1",
]

[project.optional-dependencies]
all = [
    "pywin32>=306",
    "comtypes>=1.4.0",
    "pygments>=2.15",
    "tsdownsample>=0.1.5.1",
    "mermaidx>=0.9; python_version >= '3.10'",
    "orjson>=3.9",
    "polars>=1.0",
]
orjson = [
    "orjson>=3.9",
]
# ElaParquetTable 从顶层 __init__ 导出，所以「装了包却拿到一个必然抛
# ImportError 的公开类」是可达的。charts 系列的 polars / numpy /
# tsdownsample 走的就是 optional-dependencies 这条路，这里补齐同一套约定。
parquet = [
    "polars>=1.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/mengdeer589/pyqt5-ela-pro"
Documentation = "https://github.com/mengdeer589/pyqt5-ela-pro#readme"
Repository = "https://github.com/mengdeer589/pyqt5-ela-pro"
Issues = "https://github.com/mengdeer589/pyqt5-ela-pro/issues"

[tool.setuptools.dynamic]
version = {attr = "pyqt5_ela_pro._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["ElaWidgetTools*", "PyQt*", "PyQt-Fluent*", "PyQt-SiliconUI*", "build*", "dist*", "*.egg-info"]
include = ["pyqt5_ela_pro*"]

[tool.setuptools.package-data]
pyqt5_ela_pro = ["icons/*.svg", "icons/*.png", "icons/*.ico", "icons/packages/*.icons"]

[tool.uv]
required-environments="sys_platform == 'win32' and platform_machine == 'AMD64'"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让测试目录本身可导入，`from _qthelpers import wait_until` 才能在各子目录的
# 测试文件里生效（tests/ 下没有 __init__.py，否则靠 conftest 的副作用隐式生效）。
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.14.1",
    "pygments>=2.15",
    "tsdownsample>=0.1.5.1",
    "orjson>=3.9",
]
